name: inventory_management
description: "Professional Inventory Management Application"
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  # State Management
  provider: ^6.1.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # CSV Handling
  csv: ^6.0.0

  # File Operations
  file_picker: ^8.0.0
  path_provider: ^2.1.0


  # UI Icons
  cupertino_icons: ^1.0.8

  # Barcode Scanning - Mobile Live Camera
  mobile_scanner: ^5.0.0

  # Barcode Scanning - Desktop/Web Camera
  camera: ^0.10.5+9

  # Barcode Detection from Images
  google_mlkit_barcode_scanning: ^0.11.0

  # Image Picking for Barcode Scanning
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # Linting
  flutter_lints: ^4.0.0
  
  # Code Generation for Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true